site_name: pyflowstep
site_description: Compose plain functions into readable, reusable flows, built in Python or loaded from JSON and TOML.
site_url: https://aaltatan.github.io/pyflowstep/
repo_url: https://github.com/aaltatan/pyflowstep
repo_name: aaltatan/pyflowstep
edit_uri: edit/main/docs/
copyright: GPL-3.0-or-later

theme:
  name: material
  icon:
    logo: material/transit-connection-variant
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - toc.follow

nav:
  - Home: index.md
  - Installation: install.md
  - User guide:
      - guide/index.md
      - Steps and flows: guide/steps.md
      - Registries: guide/registries.md
      - Arguments and processing: guide/arguments.md
      - Dependencies: guide/dependencies.md
      - Run inputs and outputs: guide/inputs.md
      - Variants and chains: guide/variants-and-chains.md
      - Compiling flows from JSON and TOML: guide/compiling.md
      - JSON Schema: guide/json-schema.md
      - With pyspecification and pyformula: guide/family.md
  - Recipes: recipes.md
  - Reference:
      - reference/index.md
      - API: reference/api.md
      - Flow definition format: reference/flow-format.md
      - Exceptions: reference/exceptions.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/aaltatan/pyflowstep
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/pyflowstep/
